[package]
name = "watchvault"
version = "1.0.0"
description = "Personal movie & TV tracker"
authors = ["Vincenzo"]
edition = "2021"

[lib]
name = "watchvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Apple Podcasts keeps its library in a Core Data SQLite file. Bundled so the
# build does not depend on whatever libsqlite the host happens to ship.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true
lto = true
